name: Deploy Murmur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the app files only
        run: |
          mkdir _site
          cp index.html style.css ui.js engine.js session.js video.js spectrum.js data.js dsp.js worker.js sw.js \
             manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
